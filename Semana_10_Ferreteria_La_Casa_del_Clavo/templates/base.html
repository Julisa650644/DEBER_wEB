<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Sistema web de Ferretería La Casa del Clavo">

    <title>{% block title %}Ferretería La Casa del Clavo{% endblock %}</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <!-- CSS propio -->
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>

<body>

    <!-- Componente reutilizable -->
    {% include "components/navbar.html" %}

    <header class="page-header py-4">
        <div class="container">
            <p class="text-uppercase small mb-1">
                Proyecto integrador · Aplicación Flask
            </p>
            <h1 class="h3 mb-0">
                {% block header %}Ferretería La Casa del Clavo{% endblock %}
            </h1>
        </div>
    </header>

    <main class="container py-4 min-vh-75">
        {% block content %}{% endblock %}
    </main>

    <!-- Componente reutilizable -->
    {% include "components/footer.html" %}

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

    <!-- JavaScript propio -->
    <script src="{{ url_for('static', filename='js/script.js') }}"></script>

    {% block scripts %}{% endblock %}
</body>
</html>
